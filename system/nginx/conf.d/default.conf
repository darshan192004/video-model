# Media System reverse proxy.
# Env-substituted at container start (envsubst '$DOMAIN'). Everything (SPA
# static + /api + /ws) proxies to the control-plane; ComfyUI is never exposed.

# Per-IP rate zone for job submission + auth endpoints (spam/abuse guardrail).
# 10 r/s sustained, burst 20, then 503; gallery/upload/healthz are NOT limited.
limit_req_zone $binary_remote_addr zone=api_high:10m rate=10r/s;

upstream controlplane_backend {
    server controlplane:8000;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name $DOMAIN;

    # Self-signed (internal), generated by scripts/gen-certs.sh.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Video-frame uploads (Wan I2V images + raw frames) are large; images small.
    client_max_body_size 50m;

    # WebSocket endpoint (job progress stream) — must upgrade.
    location /ws {
        proxy_pass http://controlplane_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Job + auth endpoints: rate-limited. Reactive, per-IP; a legit user doing
    # max a few submits/second is unaffected (burst absorbs the spikes).
    location ~ ^/api/(jobs|auth)/ {
        limit_req zone=api_high burst=20 nodelay;
        proxy_pass http://controlplane_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is plain HTTP proxying to the control-plane.
    location / {
        proxy_pass http://controlplane_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
