apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101           # nginx unprivileged uid in the alpine image
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 443
              protocol: TCP
          env:
            # server_name $DOMAIN is envsubst'd at start (same command as deploy).
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: controlplane-env
                  key: DOMAIN
          command:
            - sh
            - -c
            - >-
              envsubst '$$DOMAIN' < /etc/nginx/conf.d/default.conf > /tmp/default.conf
              && cp /tmp/default.conf /etc/nginx/conf.d/default.conf
              && exec nginx -g 'daemon off;'
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/certs
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-conf
        - name: tls
          secret:
            secretName: comfyui-tls
            items:
              - key: tls.crt
                path: fullchain.pem
              - key: tls.key
                path: privkey.pem