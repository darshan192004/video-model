apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101           # nginx unprivileged uid in the alpine image
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            # Non-root nginx: only NET_BIND_SERVICE is needed (listen 443);
            # everything else stays dropped. allowPrivilegeEscalation=false
            # blocks any setuid/gain-capability escape.
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          ports:
            - containerPort: 443
              protocol: TCP
          env:
            # server_name $DOMAIN is envsubst'd at start. The shared main
            # nginx.conf (pid /tmp, stderr logs, /tmp scratchpaths) makes the
            # image runnable as UID 101.
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: controlplane-env
                  key: DOMAIN
          command:
            - sh
            - -c
            - "envsubst '$DOMAIN' < /etc/nginx/templates/default.conf > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/templates/default.conf
              subPath: default.conf
              readOnly: true
            # Writable conf.d: the rendered file lands here (the ConfigMap
            # subPath mounts above are read-only for auditability).
            - name: confd
              mountPath: /etc/nginx/conf.d
            - name: tls
              mountPath: /etc/nginx/certs
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-conf
        - name: confd
          emptyDir: {}
        - name: tls
          secret:
            secretName: comfyui-tls
            items:
              - key: tls.crt
                path: fullchain.pem
              - key: tls.key
                path: privkey.pem