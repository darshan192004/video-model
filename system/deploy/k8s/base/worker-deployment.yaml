apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: controlplane-media:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          workingDir: /opt/media
          # No HTTP surface: the FIFO claim loop drives ComfyUI and copies
          # output into the owner's gallery. Probes are therefore omitted.
          envFrom:
            - configMapRef:
                name: controlplane-env
            - secretRef:
                name: app-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          volumeMounts:
            - name: workflows
              mountPath: /opt/media/workflows
              readOnly: true
            - name: templates-schema
              mountPath: /opt/media/config/templates.schema.json
              subPath: templates.schema.json
              readOnly: true
            - name: gallery
              mountPath: /data/galleries
            - name: uploads
              mountPath: /data/uploads
            - name: comfy-output
              mountPath: /data/comfy-output
            - name: comfy-input
              mountPath: /data/comfy-input
      volumes:
        - name: workflows
          configMap:
            name: comfyui-workflows
        - name: templates-schema
          configMap:
            name: templates-schema
        - name: gallery
          persistentVolumeClaim:
            claimName: gallery-storage
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-storage
        - name: comfy-output
          persistentVolumeClaim:
            claimName: comfyui-output
        - name: comfy-input
          persistentVolumeClaim:
            claimName: comfy-input