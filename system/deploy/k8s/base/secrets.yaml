# Secret wiring document (base carries no secret VALUES).
#
# Two Secrets are referenced by name in the base manifests and supplied by
# every overlay, so not a single secretGenerator exists at the base level:
#
#   app-secrets   envs-file Secret with keys used through envFrom/expansion:
#                   POSTGRES_USER, POSTGRES_DB, POSTGRES_PASSWORD,
#                   OIDC_CLIENT_SECRET, SESSION_SECRET
#                 (control-plane + worker assemble DATABASE_URL from the
#                  POSTGRES_* triple; OIDC/SSG secrets feed the RP.)
#   comfyui-tls   files Secret mapping tls.crt/tls.key -> fullchain.pem/privkey.pem
#                 consumed by nginx /etc/nginx/certs (Phase-1 gen-certs.sh output).
#
# The k3s dev overlay generates both from gitignored sources:
#   - secrets.env  (chmod 600; OIDC_CLIENT_SECRET/SESSION_SECRET/POSTGRES_*)
#   - deploy/certs/fullchain.pem + privkey.pem (self-signed dev certs)
# The production overlay supplies real secret values out of band. No overlay
# ever commits plaintext credentials.