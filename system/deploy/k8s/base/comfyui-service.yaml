apiVersion: v1
kind: Service
metadata:
  name: comfyui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: comfyui
  ports:
    - name: http
      port: 8188
      targetPort: 8188
      protocol: TCP
# Deliberately no external route: the only client is control-plane at
# http://comfyui:8188 (readiness /system_stats, /object_info, /prompt).