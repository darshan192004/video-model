apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
data:
  default.conf: "# Media System reverse proxy.\n# Env-substituted at container start\
    \ (envsubst '$DOMAIN'). Everything (SPA\n# static + /api + /ws) proxies to the\
    \ control-plane; ComfyUI is never exposed.\n\n# Per-IP rate zone for job submission\
    \ + auth endpoints (spam/abuse guardrail).\n# 10 r/s sustained, burst 20, then\
    \ 503; gallery/upload/healthz are NOT limited.\nlimit_req_zone $binary_remote_addr\
    \ zone=api_high:10m rate=10r/s;\n\nupstream controlplane_backend {\n    server\
    \ controlplane:8000;\n    keepalive 16;\n}\n\nserver {\n    listen 443 ssl;\n\
    \    server_name $DOMAIN;\n\n    # Self-signed (internal), generated by scripts/gen-certs.sh.\n\
    \    ssl_certificate     /etc/nginx/certs/fullchain.pem;\n    ssl_certificate_key\
    \ /etc/nginx/certs/privkey.pem;\n    ssl_protocols       TLSv1.2 TLSv1.3;\n  \
    \  ssl_ciphers         HIGH:!aNULL:!MD5;\n\n    # Video-frame uploads (Wan I2V\
    \ images + raw frames) are large; images small.\n    client_max_body_size 50m;\n\
    \n    # WebSocket endpoint (job progress stream) — must upgrade.\n    location\
    \ /ws {\n        proxy_pass http://controlplane_backend;\n        proxy_http_version\
    \ 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header\
    \ Connection \"upgrade\";\n        proxy_set_header Host $host;\n        proxy_set_header\
    \ X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
    \        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n\n    # Job + auth\
    \ endpoints: rate-limited. Reactive, per-IP; a legit user doing\n    # max a few\
    \ submits/second is unaffected (burst absorbs the spikes).\n    location ~ ^/api/(jobs|auth)/\
    \ {\n        limit_req zone=api_high burst=20 nodelay;\n        proxy_pass http://controlplane_backend;\n\
    \        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n\
    \        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n\n    # Everything\
    \ else is plain HTTP proxying to the control-plane.\n    location / {\n      \
    \  proxy_pass http://controlplane_backend;\n        proxy_set_header Host $host;\n\
    \        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-Proto\
    \ $scheme;\n    }\n}\n"
  nginx.conf: "worker_processes auto;\npid /tmp/nginx.pid;\nerror_log /dev/stderr\
    \ notice;\n\nevents {\n    worker_connections 1024;\n}\n\nhttp {\n    include\
    \ /etc/nginx/mime.types;\n    default_type application/octet-stream;\n\n    log_format\
    \ main '$remote_addr - $remote_user [$time_local] \"$request\" '\n           \
    \         '$status $body_bytes_sent \"$http_referer\" '\n                    '\"\
    $http_user_agent\" ws=$http_upgrade';\n\n    access_log /dev/stdout main;\n\n\
    \    # Non-root (k8s) friendly scratchpaths; root Nginx in compose is unaffected.\n\
    \    client_body_temp_path /tmp/nginx_client_body;\n    proxy_temp_path /tmp/nginx_proxy;\n\
    \    fastcgi_temp_path /tmp/nginx_fastcgi;\n    uwsgi_temp_path /tmp/nginx_uwsgi;\n\
    \    scgi_temp_path /tmp/nginx_scgi;\n\n    sendfile on;\n    keepalive_timeout\
    \ 65;\n\n    # Values above 180s: a ComfyUI render can idle before emitting progress.\n\
    \    proxy_read_timeout 3600s;\n    proxy_send_timeout 3600s;\n    proxy_buffering\
    \ off;\n    proxy_http_version 1.1;\n\n    include /etc/nginx/conf.d/*.conf;\n\
    }\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: comfyui-workflows
data:
  qwen-t2i.json: "{\n  \"1\": { \"class_type\": \"UNETLoader\", \"inputs\": { \"unet_name\"\
    : \"qwen_image_2.1_int8_convrot.safetensors\", \"weight_dtype\": \"default\" }\
    \ },\n  \"2\": { \"class_type\": \"CLIPLoader\", \"inputs\": { \"clip_name\":\
    \ \"qwen_image_2.1_text_encoder.f16.safetensors\", \"type\": \"qwen_image\" }\
    \ },\n  \"3\": { \"class_type\": \"VAELoader\", \"inputs\": { \"vae_name\": \"\
    qwen_image_2.1_vae.safetensors\" } },\n  \"4\": { \"class_type\": \"CLIPTextEncodeQwenImage\"\
    , \"inputs\": { \"clip\": [\"2\", 0], \"text\": \"{PARAM.prompt}\" } },\n  \"\
    5\": { \"class_type\": \"EmptyLatentImage\", \"inputs\": { \"width\": \"{PARAM.width}\"\
    , \"height\": \"{PARAM.height}\" } },\n  \"6\": { \"class_type\": \"KSampler\"\
    , \"inputs\": { \"model\": [\"1\", 0], \"positive\": [\"4\", 0], \"negative\"\
    : [\"7\", 0], \"latent_image\": [\"5\", 0], \"seed\": \"{PARAM.seed}\", \"steps\"\
    : \"{PARAM.steps}\", \"cfg\": \"{PARAM.cfg}\", \"sampler_name\": \"euler\", \"\
    scheduler\": \"normal\", \"denoise\": 1.0 } },\n  \"7\": { \"class_type\": \"\
    CLIPTextEncodeQwenImage\", \"inputs\": { \"clip\": [\"2\", 0], \"text\": \"{PARAM.negative_prompt}\"\
    \ } },\n  \"8\": { \"class_type\": \"VAEDecode\", \"inputs\": { \"samples\": [\"\
    6\", 0], \"vae\": [\"3\", 0] } },\n  \"9\": { \"class_type\": \"SaveImage\", \"\
    inputs\": { \"images\": [\"8\", 0], \"filename_prefix\": \"qwen-t2i\" } }\n}"
  qwen-edit.json: "{\n  \"1\": { \"class_type\": \"LoadImage\", \"inputs\": { \"image\"\
    : \"{PARAM.image}\" } },\n  \"2\": { \"class_type\": \"GetImageSize\", \"inputs\"\
    : { \"image\": [\"1\", 0] } },\n  \"3\": { \"class_type\": \"EmptyLatentImage\"\
    , \"inputs\": { \"width\": [\"2\", 0], \"height\": [\"2\", 1] } },\n  \"4\": {\
    \ \"class_type\": \"UNETLoader\", \"inputs\": { \"unet_name\": \"qwen_image_2.1_int8_convrot.safetensors\"\
    , \"weight_dtype\": \"default\" } },\n  \"5\": { \"class_type\": \"CLIPLoader\"\
    , \"inputs\": { \"clip_name\": \"qwen_image_2.1_text_encoder.f16.safetensors\"\
    , \"type\": \"qwen_image\" } },\n  \"6\": { \"class_type\": \"VAELoader\", \"\
    inputs\": { \"vae_name\": \"qwen_image_2.1_vae.safetensors\" } },\n  \"7\": {\
    \ \"class_type\": \"CLIPTextEncodeQwenImage\", \"inputs\": { \"clip\": [\"5\"\
    , 0], \"text\": \"{PARAM.prompt}\" } },\n  \"8\": { \"class_type\": \"CLIPTextEncodeQwenImage\"\
    , \"inputs\": { \"clip\": [\"5\", 0], \"text\": \"{PARAM.negative_prompt}\" }\
    \ },\n  \"9\": { \"class_type\": \"KSampler\", \"inputs\": { \"model\": [\"4\"\
    , 0], \"positive\": [\"7\", 0], \"negative\": [\"8\", 0], \"latent_image\": [\"\
    3\", 0], \"seed\": \"{PARAM.seed}\", \"steps\": \"{PARAM.steps}\", \"cfg\": \"\
    {PARAM.cfg}\", \"sampler_name\": \"euler\", \"scheduler\": \"normal\", \"denoise\"\
    : 1.0 } },\n  \"10\": { \"class_type\": \"VAEDecode\", \"inputs\": { \"samples\"\
    : [\"9\", 0], \"vae\": [\"6\", 0] } },\n  \"11\": { \"class_type\": \"SaveImage\"\
    , \"inputs\": { \"images\": [\"10\", 0], \"filename_prefix\": \"qwen-edit\" }\
    \ }\n}"
  wan-t2v-a14b.json: "{\n  \"1\": { \"class_type\": \"UNETLoader\", \"inputs\": {\
    \ \"unet_name\": \"wan2.2_t2v_low_noise_14B_fp8_scaled.safetensors\", \"weight_dtype\"\
    : \"default\" } },\n  \"2\": { \"class_type\": \"UNETLoader\", \"inputs\": { \"\
    unet_name\": \"wan2.2_t2v_high_noise_14B_fp8_scaled.safetensors\", \"weight_dtype\"\
    : \"default\" } },\n  \"3\": { \"class_type\": \"CLIPLoader\", \"inputs\": { \"\
    clip_name\": \"umt5_xxl_fp8_e4m3fn_scaled.safetensors\", \"type\": \"wan\" } },\n\
    \  \"4\": { \"class_type\": \"VAELoader\", \"inputs\": { \"vae_name\": \"wan_2.1_vae.safetensors\"\
    \ } },\n  \"5\": { \"class_type\": \"CLIPTextEncode\", \"inputs\": { \"clip\"\
    : [\"3\", 0], \"text\": \"{PARAM.prompt}\" } },\n  \"6\": { \"class_type\": \"\
    CLIPTextEncode\", \"inputs\": { \"clip\": [\"3\", 0], \"text\": \"{PARAM.negative_prompt}\"\
    \ } },\n  \"7\": { \"class_type\": \"EmptyHunyuanLatentVideo\", \"inputs\": {\
    \ \"width\": \"{PARAM.width}\", \"height\": \"{PARAM.height}\", \"length\": \"\
    {PARAM.length}\", \"batch_size\": 1 } },\n  \"8\": { \"class_type\": \"KSampler\"\
    , \"inputs\": { \"model\": [\"1\", 0], \"positive\": [\"5\", 0], \"negative\"\
    : [\"6\", 0], \"latent_image\": [\"7\", 0], \"seed\": \"{PARAM.seed}\", \"steps\"\
    : \"{PARAM.steps}\", \"cfg\": \"{PARAM.cfg}\", \"sampler_name\": \"euler\", \"\
    scheduler\": \"beta\", \"denoise\": 0.8 } },\n  \"9\": { \"class_type\": \"KSampler\"\
    , \"inputs\": { \"model\": [\"2\", 0], \"positive\": [\"5\", 0], \"negative\"\
    : [\"6\", 0], \"latent_image\": [\"8\", 0], \"seed\": \"{PARAM.seed}\", \"steps\"\
    : \"{PARAM.steps}\", \"cfg\": \"{PARAM.cfg}\", \"sampler_name\": \"euler\", \"\
    scheduler\": \"beta\", \"denoise\": 1.0 } },\n  \"10\": { \"class_type\": \"VAEDecode\"\
    , \"inputs\": { \"samples\": [\"9\", 0], \"vae\": [\"4\", 0] } },\n  \"11\": {\
    \ \"class_type\": \"SaveImage\", \"inputs\": { \"images\": [\"10\", 0], \"filename_prefix\"\
    : \"wan-t2v\" } }\n}"
  wan-i2v-a14b.json: "{\n  \"1\": { \"class_type\": \"LoadImage\", \"inputs\": { \"\
    image\": \"{PARAM.image}\" } },\n  \"2\": { \"class_type\": \"UNETLoader\", \"\
    inputs\": { \"unet_name\": \"wan2.2_i2v_high_noise_14B_fp16.safetensors\", \"\
    weight_dtype\": \"default\" } },\n  \"3\": { \"class_type\": \"UNETLoader\", \"\
    inputs\": { \"unet_name\": \"wan2.2_i2v_low_noise_14B_fp16.safetensors\", \"weight_dtype\"\
    : \"default\" } },\n  \"4\": { \"class_type\": \"CLIPLoader\", \"inputs\": { \"\
    clip_name\": \"umt5_xxl_fp8_e4m3fn_scaled.safetensors\", \"type\": \"wan\" } },\n\
    \  \"5\": { \"class_type\": \"VAELoader\", \"inputs\": { \"vae_name\": \"wan_2.1_vae.safetensors\"\
    \ } },\n  \"6\": { \"class_type\": \"CLIPTextEncode\", \"inputs\": { \"clip\"\
    : [\"4\", 0], \"text\": \"{PARAM.prompt}\" } },\n  \"7\": { \"class_type\": \"\
    CLIPTextEncode\", \"inputs\": { \"clip\": [\"4\", 0], \"text\": \"{PARAM.negative_prompt}\"\
    \ } },\n  \"8\": { \"class_type\": \"WanImageToVideo\", \"inputs\": { \"image\"\
    : [\"1\", 0], \"vae\": [\"5\", 0], \"width\": \"{PARAM.width}\", \"height\": \"\
    {PARAM.height}\", \"length\": \"{PARAM.length}\", \"batch_size\": 1 } },\n  \"\
    9\": { \"class_type\": \"KSampler\", \"inputs\": { \"model\": [\"2\", 0], \"positive\"\
    : [\"6\", 0], \"negative\": [\"7\", 0], \"latent_image\": [\"8\", 0], \"seed\"\
    : \"{PARAM.seed}\", \"steps\": \"{PARAM.steps}\", \"cfg\": \"{PARAM.cfg}\", \"\
    sampler_name\": \"euler\", \"scheduler\": \"beta\", \"denoise\": 1.0 } },\n  \"\
    10\": { \"class_type\": \"KSampler\", \"inputs\": { \"model\": [\"3\", 0], \"\
    positive\": [\"6\", 0], \"negative\": [\"7\", 0], \"latent_image\": [\"9\", 0],\
    \ \"seed\": \"{PARAM.seed}\", \"steps\": \"{PARAM.steps}\", \"cfg\": \"{PARAM.cfg}\"\
    , \"sampler_name\": \"euler\", \"scheduler\": \"beta\", \"denoise\": 0.8 } },\n\
    \  \"11\": { \"class_type\": \"VAEDecode\", \"inputs\": { \"samples\": [\"10\"\
    , 0], \"vae\": [\"5\", 0] } },\n  \"12\": { \"class_type\": \"SaveImage\", \"\
    inputs\": { \"images\": [\"11\", 0], \"filename_prefix\": \"wan-i2v\" } }\n}"
  smoke.json: "{\n  \"1\": { \"class_type\": \"LoadImage\", \"inputs\": { \"image\"\
    : \"smoke.png\" } },\n  \"2\": { \"class_type\": \"InvertImage\", \"inputs\":\
    \ { \"image\": [\"1\", 0] } },\n  \"9\": { \"class_type\": \"SaveImage\", \"inputs\"\
    : { \"images\": [\"2\", 0], \"filename_prefix\": \"{PARAM.seed}\" } }\n}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: templates-schema
data:
  templates.schema.json: "{\n  \"$schema\": \"http://json-schema.org/draft-07/schema#\"\
    ,\n  \"title\": \"Media system template parameters (authoritative). 'templates'\
    \ is the live template DB keyed by template id; the outer structure self-validates\
    \ entry shape.\",\n  \"type\": \"object\",\n  \"additionalProperties\": false,\n\
    \  \"required\": [\"templates\"],\n  \"properties\": {\n    \"templates\": {\n\
    \      \"type\": \"object\",\n      \"additionalProperties\": {\n        \"type\"\
    : \"object\",\n        \"required\": [\"workflow\", \"params\"],\n        \"properties\"\
    : {\n          \"display\": { \"type\": \"string\" },\n          \"workflow\"\
    : { \"type\": \"string\", \"pattern\": \"^[a-z0-9-]+\\\\.json$\" },\n        \
    \  \"params\": {\n            \"type\": \"object\",\n            \"additionalProperties\"\
    : {\n              \"type\": \"object\",\n              \"required\": [\"type\"\
    , \"label\"],\n              \"properties\": {\n                \"type\": { \"\
    type\": \"string\", \"enum\": [\"string\", \"int\", \"float\", \"bool\", \"image\"\
    , \"enum\"] },\n                \"label\": { \"type\": \"string\" },\n       \
    \         \"required\": { \"type\": \"boolean\" },\n                \"default\"\
    : {},\n                \"min\": {},\n                \"max\": {},\n          \
    \      \"step\": {},\n                \"values\": { \"type\": \"array\" },\n \
    \               \"resolutions\": { \"type\": \"object\" },\n                \"\
    bind\": { \"type\": \"string\", \"pattern\": \"^[0-9]+\\\\.[a-z_]+$\" }\n    \
    \          }\n            }\n          }\n        }\n      }\n    }\n  },\n  \"\
    templates\": {\n    \"qwen-t2i\": {\n      \"display\": \"Qwen 2.1 Text-to-Image\"\
    ,\n      \"workflow\": \"qwen-t2i.json\",\n      \"params\": {\n        \"prompt\"\
    : { \"type\": \"string\", \"required\": true, \"label\": \"Prompt\", \"bind\"\
    : \"4.text\" },\n        \"negative_prompt\": { \"type\": \"string\", \"default\"\
    : \"\", \"label\": \"Negative prompt\", \"bind\": \"7.text\" },\n        \"seed\"\
    : { \"type\": \"int\", \"default\": 999, \"min\": 0, \"max\": 2147483647, \"label\"\
    : \"Seed\", \"bind\": \"6.seed\" },\n        \"steps\": { \"type\": \"int\", \"\
    default\": 20, \"min\": 1, \"max\": 60, \"label\": \"Steps\", \"bind\": \"6.steps\"\
    \ },\n        \"cfg\": { \"type\": \"float\", \"default\": 4.0, \"min\": 1.0,\
    \ \"max\": 20.0, \"step\": 0.5, \"label\": \"CFG\", \"bind\": \"6.cfg\" },\n \
    \       \"megapixels\": {\n          \"type\": \"enum\",\n          \"values\"\
    : [1.0, 2.0, 3.0, 4.0],\n          \"resolutions\": { \"1.0\": [896, 1152], \"\
    2.0\": [1280, 1600], \"3.0\": [1344, 2048], \"4.0\": [1536, 2048] },\n       \
    \   \"default\": 1.0,\n          \"label\": \"Resolution (megapixels)\",\n   \
    \       \"bind\": \"5.width\"\n        }\n      }\n    },\n    \"qwen-edit\":\
    \ {\n      \"display\": \"Qwen 2.1 Image Edit\",\n      \"workflow\": \"qwen-edit.json\"\
    ,\n      \"params\": {\n        \"image\": { \"type\": \"image\", \"required\"\
    : true, \"label\": \"Source image\", \"bind\": \"1.image\" },\n        \"prompt\"\
    : { \"type\": \"string\", \"required\": true, \"label\": \"Instruction\", \"bind\"\
    : \"7.text\" },\n        \"negative_prompt\": { \"type\": \"string\", \"default\"\
    : \"\", \"label\": \"Negative prompt\", \"bind\": \"8.text\" },\n        \"seed\"\
    : { \"type\": \"int\", \"default\": 999, \"min\": 0, \"max\": 2147483647, \"label\"\
    : \"Seed\", \"bind\": \"9.seed\" },\n        \"steps\": { \"type\": \"int\", \"\
    default\": 20, \"min\": 1, \"max\": 60, \"label\": \"Steps\", \"bind\": \"9.steps\"\
    \ },\n        \"cfg\": { \"type\": \"float\", \"default\": 4.0, \"min\": 1.0,\
    \ \"max\": 20.0, \"step\": 0.5, \"label\": \"CFG\", \"bind\": \"9.cfg\" }\n  \
    \    }\n    },\n    \"wan-t2v\": {\n      \"display\": \"Wan 2.2 Text-to-Video\
    \ 14B\",\n      \"workflow\": \"wan-t2v-a14b.json\",\n      \"params\": {\n  \
    \      \"prompt\": { \"type\": \"string\", \"required\": true, \"label\": \"Prompt\"\
    , \"bind\": \"5.text\" },\n        \"negative_prompt\": { \"type\": \"string\"\
    , \"default\": \"\", \"label\": \"Negative prompt\", \"bind\": \"6.text\" },\n\
    \        \"seed\": { \"type\": \"int\", \"default\": 999, \"min\": 0, \"max\"\
    : 2147483647, \"label\": \"Seed\", \"bind\": \"8.seed\" },\n        \"steps\"\
    : { \"type\": \"int\", \"default\": 30, \"min\": 1, \"max\": 60, \"label\": \"\
    Steps\", \"bind\": \"8.steps\" },\n        \"cfg\": { \"type\": \"float\", \"\
    default\": 5.0, \"min\": 1.0, \"max\": 20.0, \"step\": 0.5, \"label\": \"CFG\"\
    , \"bind\": \"8.cfg\" },\n        \"length\": { \"type\": \"int\", \"default\"\
    : 81, \"min\": 9, \"max\": 121, \"step\": 4, \"label\": \"Frames\", \"bind\":\
    \ \"7.length\" },\n        \"resolution\": {\n          \"type\": \"enum\",\n\
    \          \"values\": [[832, 480], [1280, 720]],\n          \"default\": [832,\
    \ 480],\n          \"label\": \"Resolution (WxH)\",\n          \"bind\": \"7.width\"\
    \n        }\n      }\n    },\n    \"wan-i2v\": {\n      \"display\": \"Wan 2.2\
    \ Image-to-Video 14B\",\n      \"workflow\": \"wan-i2v-a14b.json\",\n      \"\
    params\": {\n        \"image\": { \"type\": \"image\", \"required\": true, \"\
    label\": \"Source image\", \"bind\": \"1.image\" },\n        \"prompt\": { \"\
    type\": \"string\", \"required\": true, \"label\": \"Motion prompt\", \"bind\"\
    : \"6.text\" },\n        \"negative_prompt\": { \"type\": \"string\", \"default\"\
    : \"\", \"label\": \"Negative prompt\", \"bind\": \"7.text\" },\n        \"seed\"\
    : { \"type\": \"int\", \"default\": 999, \"min\": 0, \"max\": 2147483647, \"label\"\
    : \"Seed\", \"bind\": \"9.seed\" },\n        \"steps\": { \"type\": \"int\", \"\
    default\": 30, \"min\": 1, \"max\": 60, \"label\": \"Steps\", \"bind\": \"9.steps\"\
    \ },\n        \"cfg\": { \"type\": \"float\", \"default\": 5.0, \"min\": 1.0,\
    \ \"max\": 20.0, \"step\": 0.5, \"label\": \"CFG\", \"bind\": \"9.cfg\" },\n \
    \       \"length\": { \"type\": \"int\", \"default\": 81, \"min\": 9, \"max\"\
    : 121, \"step\": 4, \"label\": \"Frames\", \"bind\": \"8.length\" },\n       \
    \ \"resolution\": {\n          \"type\": \"enum\",\n          \"values\": [[832,\
    \ 480], [1280, 720]],\n          \"default\": [832, 480],\n          \"label\"\
    : \"Resolution (WxH)\",\n          \"bind\": \"8.width\"\n        }\n      }\n\
    \    },\n    \"smoke\": {\n      \"display\": \"Smoke test (CPU, no weights)\"\
    ,\n      \"workflow\": \"smoke.json\",\n      \"params\": {\n        \"seed\"\
    : { \"type\": \"string\", \"default\": \"smoke-out\", \"label\": \"Output prefix\"\
    , \"bind\": \"9.filename_prefix\" }\n      }\n    }\n  }\n}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: controlplane-env
data:
  CONTROLPLANE_LISTEN: 0.0.0.0
  CONTROLPLANE_PORT: '8000'
  COMFY_INTERNAL_URL: http://comfyui:8188
  GALLERY_ROOT: /data/galleries
  UPLOAD_ROOT: /data/uploads
  COMFY_OUTPUT_DIR: /data/comfy-output
  COMFY_INPUT_DIR: /data/comfy-input
  WORKFLOWS_DIR: /opt/media/workflows
  TEMPLATE_SCHEMA: /opt/media/config/templates.schema.json
  ADMIN_GROUPS: media-admins
  DEFAULT_ADMIN_GROUPS: media-admins
  AUTO_MIGRATE: '1'
  OIDC_MOCK: '0'
  OIDC_CLIENT_ID: media-controlplane
  WORKER_POLL_SECONDS: '2'
  WORKER_JOB_TIMEOUT_SECONDS: '3600'
  DOMAIN: media.local
  DEX_OIDC_ISSUER: http://host.docker.internal:5556/dex
  OIDC_REDIRECT_URI: https://media.local/api/auth/callback
