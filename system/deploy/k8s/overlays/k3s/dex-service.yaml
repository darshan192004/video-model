apiVersion: v1
kind: Service
metadata:
  name: dex
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: dex
  ports:
    - name: http
      port: 5556
      targetPort: 5556
      nodePort: 30556
      protocol: TCP
# NodePort 30556 = the Dex reachability contract: the control-plane pod dials
# http://<node-ip>:30556/dex and the test host dials http://127.0.0.1:30556/dex —
# k3s binds NodePorts on 0.0.0.0 so one Service serves both legs.