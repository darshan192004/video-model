apiVersion: v1
kind: ConfigMap
metadata:
  name: config-dex
data:
  config.yaml: |
    # Test-only static connector, k3s flavor of deploy/dex/config.yaml.
    # ${NODE_IP}: substitute the dev box LAN IP (NodePort binding 0.0.0.0 makes
    # the SAME URL reachable from the control-plane pod AND the test host).
    issuer: http://${NODE_IP}:30556/dex
    storage:
      type: memory
    web:
      http: "0.0.0.0:5556"
    staticClients:
      - id: media-controlplane
        redirectURIs:
          - "https://127.0.0.1:30443/api/auth/callback"
          - "http://localhost/api/auth/callback"
        name: Media System
        secret: test-secret
    enablePasswordDB: true
    staticPasswords:
      - email: "admin@test"
        hash: "$2b$12$M2W7ngeWpJT0bc/ELjCCgenAG4DlAOeTDgZeyICa.LS7F0BMn3h2q"
        username: "admin"
        userID: "test-admin"
      - email: "user@test"
        hash: "$2b$12$.FV0R2hWLhNwOMzlVWu.aOL../rq5aY7MpJjWid.rivv406/t4EfO"
        username: "user"
        userID: "test-user"
    staticGroups:
      - email: "admin@test"
        group: "media-admins"
        userID: "test-admin"