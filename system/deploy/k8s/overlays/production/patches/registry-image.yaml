# Swap the local image refs for the operator's registry. The worker reuses the
# control-plane image (FIFO consumer), exactly as in compose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
spec:
  template:
    spec:
      containers:
        - name: comfyui
          image: registry.internal.example/media/comfyui:0.1.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlplane
spec:
  template:
    spec:
      containers:
        - name: controlplane
          image: registry.internal.example/media/controlplane:0.1.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  template:
    spec:
      containers:
        - name: worker
          image: registry.internal.example/media/controlplane:0.1.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  template:
    spec:
      containers:
        - name: nginx
          image: registry.internal.example/media/nginx:latest
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  template:
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine