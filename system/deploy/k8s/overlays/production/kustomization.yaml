apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Production GPU overlay — VALIDATE-ONLY in this repo (no GPU node / registry /
# org Dex reachable here). Same base as the k3s dev overlay, with the GPU node
# contract, real image registry, ingress, StorageClass'd PVCs, real (out-of-band)
# secrets behind the .env admission, and a real-PV `models` claim.
namespace: media-system
resources:
  - ../../base
  - pvc-models.yaml
  - ingress.yaml
patches:
  - path: patches/gpu-device.yaml
  - path: patches/registry-image.yaml
  - path: patches/models-pv.yaml
  - path: patches/pvc-storageclass.yaml
  - path: patches/controlplane-env-cm.yaml
secretGenerator:
  - name: comfyui-tls
    files:
      - tls.crt=certs/fullchain.pem
      - tls.key=certs/privkey.pem
  - name: app-secrets
    envs:
      - secrets.env