services:
  comfyui:
    image: comfyui-media:0.1.0
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      COMFY_LISTEN: ${COMFY_LISTEN:-0.0.0.0}
      COMFY_PORT: ${COMFY_PORT:-8188}
      COMFY_MODE: ${COMFY_MODE:-gpu}
      COMFY_VRAM: ${COMFY_VRAM:-}
    # models mount points at the link-models.sh symlink forest (system/models/)
    # when LINKED_MODELS is set; MODELS_PATH keeps the direct tree fallback.
    volumes:
      - ${LINKED_MODELS:-${MODELS_PATH:-/srv/media-weights}}:${LINKED_DEST:-/opt/ComfyUI/models}
      - comfy-output:/opt/ComfyUI/output
      - comfy-input:/opt/ComfyUI/input
      - comfy-user:/opt/ComfyUI/user
    networks:
      - comfy-internal
    # NO ports published for comfyui: it is only reachable via the control-plane
    # on the private network.

  controlplane:
    # Liveness: GET /api/healthz always answers 200 with {"status":"ok","db":"up|down"};
    # it is deliberately not a readiness gate, so a transient Postgres outage
    # never takes the container out of rotation.
    image: controlplane-media:0.1.0
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - path: ../../.env
        required: false
    environment:
      CONTROLPLANE_LISTEN: ${CONTROLPLANE_LISTEN:-0.0.0.0}
      CONTROLPLANE_PORT: ${CONTROLPLANE_PORT:-8000}
      COMFY_INTERNAL_URL: ${COMFY_INTERNAL_URL:-http://comfyui:8188}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://media:media@postgres:5432/media}
      GALLERY_ROOT: ${GALLERY_ROOT:-/data/galleries}
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/data/uploads}
      DEX_OIDC_ISSUER: ${DEX_OIDC_ISSUER:-http://host.docker.internal:5556/dex}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-media-controlplane}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-https://${DOMAIN:-media.local}/api/auth/callback}
      ADMIN_GROUPS: ${ADMIN_GROUPS:-media-admins}
      DEFAULT_ADMIN_GROUPS: ${DEFAULT_ADMIN_GROUPS:-media-admins}
      SESSION_SECRET: ${SESSION_SECRET:-}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-1}
      OIDC_MOCK: ${OIDC_MOCK:-0}
      SPA_STATIC: ${SPA_STATIC:-/opt/media/spa}
      COMFY_OUTPUT_DIR: ${COMFY_OUTPUT_DIR:-/data/comfy-output}
      COMFY_INPUT_DIR: ${COMFY_INPUT_DIR:-/data/comfy-input}
      WORKFLOWS_DIR: ${WORKFLOWS_DIR:-/opt/media/workflows}
      TEMPLATE_SCHEMA: ${TEMPLATE_SCHEMA:-/opt/media/config/templates.schema.json}
      TEMPLATE_FIXTURES_DIR: ${TEMPLATE_FIXTURES_DIR:-}
    volumes:
      - media-galleries:${GALLERY_ROOT:-/data/galleries}
      - media-uploads:${UPLOAD_ROOT:-/data/uploads}
      # The worker reads ComfyUI's scratch output and stages input images from
      # these shared volumes.
      - comfy-output:${COMFY_OUTPUT_DIR:-/data/comfy-output}
      - comfy-input:${COMFY_INPUT_DIR:-/data/comfy-input}
      # Phase 2 graphs + schema are read-only mounts owned by the repo, never
      # written by the API/worker containers.
      - ../../workflows:/opt/media/workflows:ro
      - ../../config:/opt/media/config:ro
    # Postgres must be accepting connections before schema_up() runs at boot;
    # the app also retries DATABASE_URL for up to 60s.
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - comfy-internal

  worker:
    # Same controlplane image, but as a single FIFO job consumer instead of the
    # API: claims `jobs WHERE status='queued' ORDER BY created_at FOR UPDATE
    # SKIP LOCKED`, drives ComfyUI, then copies output into the owner's gallery.
    image: controlplane-media:0.1.0
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://media:media@postgres:5432/media}
      COMFY_INTERNAL_URL: ${COMFY_INTERNAL_URL:-http://comfyui:8188}
      COMFY_OUTPUT_DIR: ${COMFY_OUTPUT_DIR:-/data/comfy-output}
      COMFY_INPUT_DIR: ${COMFY_INPUT_DIR:-/data/comfy-input}
      GALLERY_ROOT: ${GALLERY_ROOT:-/data/galleries}
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/data/uploads}
      WORKFLOWS_DIR: ${WORKFLOWS_DIR:-/opt/media/workflows}
      TEMPLATE_SCHEMA: ${TEMPLATE_SCHEMA:-/opt/media/config/templates.schema.json}
      TEMPLATE_FIXTURES_DIR: ${TEMPLATE_FIXTURES_DIR:-}
      DEX_OIDC_ISSUER: ${DEX_OIDC_ISSUER:-http://host.docker.internal:5556/dex}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-media-controlplane}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-https://${DOMAIN:-media.local}/api/auth/callback}
      ADMIN_GROUPS: ${ADMIN_GROUPS:-media-admins}
      DEFAULT_ADMIN_GROUPS: ${DEFAULT_ADMIN_GROUPS:-media-admins}
      SESSION_SECRET: ${SESSION_SECRET:-}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-1}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      WORKER_JOB_TIMEOUT_SECONDS: ${WORKER_JOB_TIMEOUT_SECONDS:-3600}
    volumes:
      - media-galleries:${GALLERY_ROOT:-/data/galleries}
      - media-uploads:${UPLOAD_ROOT:-/data/uploads}
      - comfy-output:${COMFY_OUTPUT_DIR:-/data/comfy-output}
      - comfy-input:${COMFY_INPUT_DIR:-/data/comfy-input}
      - ../../workflows:/opt/media/workflows:ro
      - ../../config:/opt/media/config:ro
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - comfy-internal

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-media}
      POSTGRES_USER: ${POSTGRES_USER:-media}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-media}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-media} -d ${POSTGRES_DB:-media}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - comfy-internal

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports:
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-media.local}
    volumes:
      - ./../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./../../nginx/conf.d:/etc/nginx/conf.d
      - ./../../deploy/certs:/etc/nginx/certs:ro
    command: >
      sh -c "envsubst '$$DOMAIN' < /etc/nginx/conf.d/default.conf > /tmp/default.conf
      && cp /tmp/default.conf /etc/nginx/conf.d/default.conf
      && exec nginx -g 'daemon off;'"
    depends_on:
      - controlplane
    networks:
      - comfy-internal

volumes:
  comfy-output:
  comfy-input:
  comfy-user:
  media-galleries:
  media-uploads:
  pg-data:

networks:
  comfy-internal:
    driver: bridge
